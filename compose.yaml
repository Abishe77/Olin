
services:
  db:
    image: postgres:18

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./olin_app/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - olin_private_storage:/app/private_storage
      - olin_model_cache:/app/training/models

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    image: nginx:alpine

    ports:
      - "127.0.0.1:5500:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    depends_on:
      - api

    restart: unless-stopped

volumes:
  postgres_data:
  olin_private_storage:
  olin_model_cache:
