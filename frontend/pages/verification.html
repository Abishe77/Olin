
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email — Olin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/verification.css">
</head>

<body>

    <canvas id="background-dots"></canvas>

    <main class="auth-flow-container">

        <section class="auth-flow-intro">
            <a href="./login.html" class="auth-logo">Olin</a>

            <p class="eyebrow">ACCOUNT VERIFICATION</p>

            <h1>One final step.</h1>

            <p class="intro-description">
                Verify your email address to complete your
                registration and access Olin.
            </p>
        </section>

        <section class="auth-flow-panel">

            <div class="panel-heading">
                <h2>Check your inbox</h2>

                <p>
                    Enter the six-digit verification code
                    sent to your email address.
                </p>
            </div>

            <form id="verification-form">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="otp">Verification code</label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="Enter your 6-digit code"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        minlength="6"
                        maxlength="6"
                        required
                    >
                </div>

                <p
                    id="verification-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="verify-button"
                    class="primary-button"
                >
                    Verify email
                </button>

            </form>

            <div class="panel-divider">
                <span></span>
                <p>EMAIL NOT RECEIVED?</p>
                <span></span>
            </div>

            <button
                type="button"
                id="resend-button"
                class="secondary-button"
            >
                Resend verification code
            </button>

            <p class="bottom-prompt">
                Already verified?
                <a href="./login.html">Sign in</a>
            </p>

        </section>

    </main>

    <script src="../js/background.js"></script>
    <script src="../js/verification.js"></script>

</body>
</html>
